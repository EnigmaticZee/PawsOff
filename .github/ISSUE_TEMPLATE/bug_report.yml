name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! If the keyboard ever stays locked, click Unlock, or lock your computer (Mac: Apple menu → Lock Screen; Windows: Ctrl+Alt+Delete → Lock). Paws Off always lets go then.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Mac, Windows]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Paws Off version (bottom of Settings) and your macOS or Windows version.
      placeholder: Paws Off 2.0.6 on macOS 15.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [One-line installer, Downloaded the DMG / installer, Homebrew]
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, which mode you were in (Clean / Away), keyboard type, etc.
