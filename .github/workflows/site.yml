name: Site
# Publishes the landing page and the one-line installers (site/) to GitHub Pages:
# https://enigmaticzee.github.io/PawsOff/
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the README images
        run: |
          mkdir -p site/images
          cp docs/images/icon.png docs/images/hero-light.png docs/images/hero-dark.png docs/images/windows.png site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
