name: Build

# Every push builds both apps and their installers. Pushing a version tag (v1.5.0) also publishes a
# GitHub Release with the Mac DMG, the Windows installer and the portable Windows app attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - name: Install dmgbuild
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet dmgbuild==1.6.5
      - name: Build universal app and DMG
        run: DMGBUILD=.venv/bin/dmgbuild Tools/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PawsOff-mac
          path: dist/PawsOff-mac.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet publish windows/PawsOff.csproj -c Release -o out
      - name: Render UI previews
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/PawsOff.exe -ArgumentList '--render-previews', "$PWD\previews" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Preview render failed with exit code $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DAppExe=$PWD\out\PawsOff.exe" windows\installer\PawsOff.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item out/PawsOff.exe dist/PawsOff-Windows-Portable.exe
          Get-ChildItem dist
      - name: Screenshot the installer wizard
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force installer-screens | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("installer-screens\$name.png")
          }
          $setup = Start-Process dist\PawsOff-Windows-Setup.exe -PassThru
          Start-Sleep 6; Shot "1-welcome"
          $shell = New-Object -ComObject WScript.Shell
          $shell.AppActivate($setup.Id) | Out-Null; Start-Sleep 1
          $shell.SendKeys("{ENTER}"); Start-Sleep 3; Shot "2-options"
          Get-Process | Where-Object { $_.ProcessName -like "PawsOff-Windows-Setup*" } | Stop-Process -Force
      - name: Test silent install and uninstall
        shell: pwsh
        run: |
          $p = Start-Process dist\PawsOff-Windows-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Paws Off"
          if (-not (Test-Path "$dir\PawsOff.exe")) { throw "PawsOff.exe was not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Paws Off.lnk")) { throw "Start menu shortcut missing" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PawsOff -ErrorAction SilentlyContinue
          if (-not $run) { throw "Sign-in entry missing" }
          Write-Host "Installed OK: $dir"
          Get-Process PawsOff -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru -Wait
          Start-Sleep 3
          if (Test-Path "$dir\PawsOff.exe") { throw "Uninstall left PawsOff.exe behind" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PawsOff -ErrorAction SilentlyContinue
          if ($run) { throw "Uninstall left the sign-in entry behind" }
          Write-Host "Uninstalled OK"
      - uses: actions/upload-artifact@v4
        with:
          name: PawsOff-Windows
          path: |
            dist/PawsOff-Windows-Setup.exe
            dist/PawsOff-Windows-Portable.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-previews
          path: previews
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-screens
          path: installer-screens
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to find the previous tag for the changelog link
      - uses: actions/download-artifact@v4
        with:
          pattern: PawsOff-*
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          DL="$REPO/releases/download/${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          size() { du -k "dist/$1" | awk '{ printf "%.1f MB", $1 / 1024 }'; }
          {
            echo "## What's new"
            echo
            awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' docs/HISTORY.md
            echo
            echo "## Download"
            echo
            echo "| Platform | File | Size |"
            echo "| --- | --- | --- |"
            echo "| 🍎 **Mac** · macOS 14+, Apple Silicon & Intel | [PawsOff-mac.dmg]($DL/PawsOff-mac.dmg) | $(size PawsOff-mac.dmg) |"
            echo "| 🪟 **Windows** · 10 & 11, installer | [PawsOff-Windows-Setup.exe]($DL/PawsOff-Windows-Setup.exe) | $(size PawsOff-Windows-Setup.exe) |"
            echo "| 🪟 **Windows** · portable, no install | [PawsOff-Windows-Portable.exe]($DL/PawsOff-Windows-Portable.exe) | $(size PawsOff-Windows-Portable.exe) |"
            echo
            echo "## Installing"
            echo
            echo "**Mac:** open the DMG and drag Paws Off into Applications. The first time you open it, macOS blocks it because it isn't notarized yet: click **Done**, then **System Settings → Privacy & Security → Open Anyway**. Then click **Grant Access** in Paws Off and switch it on under **Accessibility**."
            echo
            echo "**Windows:** run the installer. If SmartScreen says *Windows protected your PC*, click **More info → Run anyway** (the app isn't code-signed yet). No admin rights needed; uninstall any time from **Settings → Apps**."
            echo
            echo "Full steps and FAQ: [README]($REPO#-install)"
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            (cd dist && sha256sum PawsOff-mac.dmg PawsOff-Windows-Setup.exe PawsOff-Windows-Portable.exe)
            echo '```'
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** [$PREV...${GITHUB_REF_NAME}]($REPO/compare/$PREV...${GITHUB_REF_NAME})"
            fi
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PawsOff-mac.dmg dist/PawsOff-Windows-Setup.exe dist/PawsOff-Windows-Portable.exe \
            --title "Paws Off ${GITHUB_REF_NAME}" --notes-file notes.md --latest
